# Publie le livre Quarto sur GitHub Pages (branche gh-pages)
name: Publier sur GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quarto-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Installer les packages R
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "tidyverse", "readxl", "broom", "shiny", "janitor",
            "gt", "scales", "writexl", "rmarkdown", "knitr", "downlit", "xml2"
          )
          install.packages(pkgs, repos = "https://cloud.r-project.org")

      - name: Rendre et publier
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
