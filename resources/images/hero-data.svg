<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="Composition abstraite de données : courbes, points et barres">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2E2F"/>
      <stop offset="55%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#1A6B5C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E8A838" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A838" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <ellipse cx="900" cy="180" rx="280" ry="160" fill="url(#glow)"/>
  <!-- Axes -->
  <path d="M120 620 H1080 M120 120 V620" stroke="#F2F7F5" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Bars -->
  <g fill="#E8A838" fill-opacity="0.85">
    <rect x="200" y="420" width="48" height="200" rx="4"/>
    <rect x="280" y="340" width="48" height="280" rx="4"/>
    <rect x="360" y="380" width="48" height="240" rx="4"/>
    <rect x="440" y="300" width="48" height="320" rx="4"/>
    <rect x="520" y="360" width="48" height="260" rx="4"/>
  </g>
  <!-- Curve -->
  <path d="M180 520 C320 500, 400 280, 560 300 S820 480, 980 220" stroke="#F2F7F5" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>
  <!-- Scatter -->
  <g fill="#F2F7F5">
    <circle cx="260" cy="490" r="6" opacity="0.9"/>
    <circle cx="340" cy="410" r="5" opacity="0.75"/>
    <circle cx="430" cy="350" r="7" opacity="0.85"/>
    <circle cx="540" cy="330" r="5" opacity="0.7"/>
    <circle cx="680" cy="390" r="6" opacity="0.8"/>
    <circle cx="820" cy="300" r="7" opacity="0.9"/>
    <circle cx="940" cy="240" r="6" opacity="0.85"/>
  </g>
  <!-- Small multiples -->
  <g stroke="#F2F7F5" stroke-opacity="0.35" stroke-width="2" fill="none">
    <rect x="780" y="480" width="120" height="80" rx="6"/>
    <path d="M800 540 L820 520 L840 530 L860 500 L880 510"/>
    <rect x="920" y="480" width="120" height="80" rx="6"/>
    <path d="M940 530 L960 510 L980 525 L1000 495 L1020 505"/>
  </g>
</svg>
