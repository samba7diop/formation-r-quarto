<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Illustration de couverture : données et analyse</title>
  <desc id="desc">Courbes, points et histogrammes lumineux sur fond vert profond.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f32"/>
      <stop offset=".55" stop-color="#10534f"/>
      <stop offset="1" stop-color="#13766b"/>
    </linearGradient>
    <radialGradient id="halo" cx=".65" cy=".28" r=".6">
      <stop offset="0" stop-color="#e8ad4b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#e8ad4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ad4b" stop-opacity=".27"/>
      <stop offset="1" stop-color="#e8ad4b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e8f1e9" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#e8f1e9" fill-opacity=".24"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="1120" rx="28" fill="url(#bg)"/>
  <rect width="900" height="1120" rx="28" fill="url(#halo)"/>
  <rect width="900" height="1120" rx="28" fill="url(#grid)"/>
  <circle cx="720" cy="235" r="165" fill="none" stroke="#f6e8c8" stroke-opacity=".16" stroke-width="1.5"/>
  <circle cx="720" cy="235" r="125" fill="none" stroke="#f6e8c8" stroke-opacity=".13" stroke-width="1.5"/>
  <circle cx="720" cy="235" r="84" fill="none" stroke="#f6e8c8" stroke-opacity=".11" stroke-width="1.5"/>
  <g transform="translate(102 450)">
    <path d="M0 440H690M0 0V440" stroke="#f7faf7" stroke-opacity=".38" stroke-width="2"/>
    <path d="M0 350H690M0 260H690M0 170H690M0 80H690" stroke="#f7faf7" stroke-opacity=".12" stroke-width="1" stroke-dasharray="5 9"/>
    <path d="M35 438V315h54v123M122 438V260h54v178M209 438V288h54v150M296 438V184h54v254M383 438V218h54v220M470 438V122h54v316M557 438V148h54v290" fill="#e8ad4b" fill-opacity=".78"/>
    <path d="M0 385 C90 365 116 330 177 341 S260 295 318 270 S413 292 467 220 S566 182 690 48V440H0Z" fill="url(#area)"/>
    <path d="M0 385 C90 365 116 330 177 341 S260 295 318 270 S413 292 467 220 S566 182 690 48" fill="none" stroke="#f7faf7" stroke-width="5" stroke-linecap="round"/>
    <g fill="#f7faf7" stroke="#10534f" stroke-width="4" filter="url(#glow)">
      <circle cx="0" cy="385" r="8"/><circle cx="177" cy="341" r="8"/><circle cx="318" cy="270" r="8"/><circle cx="467" cy="220" r="8"/><circle cx="690" cy="48" r="8"/>
    </g>
  </g>
  <g fill="#f6e8c8">
    <circle cx="165" cy="192" r="4"/><circle cx="235" cy="230" r="3"/><circle cx="300" cy="175" r="5"/>
    <circle cx="565" cy="355" r="3"/><circle cx="640" cy="393" r="5"/><circle cx="745" cy="355" r="3"/>
    <circle cx="150" cy="980" r="4"/><circle cx="736" cy="920" r="4"/><circle cx="790" cy="990" r="3"/>
  </g>
  <path d="M80 1040H820" stroke="#f7faf7" stroke-opacity=".27" stroke-width="2"/>
</svg>
